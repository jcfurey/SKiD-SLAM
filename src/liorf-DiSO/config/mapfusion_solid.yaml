# ROS 2 parameter file. The "/**" wildcard applies these values to every
# liorf node regardless of the node name the launch file assigns.
/**:
  ros__parameters:
    mapfusion:
        solid:
            knn_feature_dim: 40
            max_range: 80
            num_sector: 60
            num_height: 64
            num_nearest_matches: 50
            num_match_candidates: 1
            fov_up: 2.0
            fov_down: -24.8

        interRobot:
            #topic
            solid_topic: "solid"
            # Accepted loop factors use a separate, shared publisher/subscriber
            # contract rather than being inferred from solid_topic.
            loop_topic: "context/loop_info"
            solid_frame: "base_link"
            local_topic: "liorf/mapping/cloud_info"

            #thres
            loop_threshold: 0.2 #
            # Dimensionless Mahalanobis distance in paper Equation (11).
            pcm_threshold: 4.0
            # Aggregate local-trajectory uncertainty used during PCM.
            pcm_local_rotation_stddev_rad: 0.05
            pcm_local_translation_stddev_m: 0.20
            icp_threshold: 3.0
            loop_frame_threshold: 10 #frames
            pcm_start_threshold: 5   # 5 for best result, 2 for work in harsh environment

            robot_initial: jackal0
            use_position_search: false #use position search may introduce more global loop closure, but spend more time for candidate checking

        comms:
            # Descriptor announcements are continuous; scans move only when a
            # descriptor match has justified attempting registration. Set
            # announce_scans true to restore the older behaviour of attaching
            # every feature cloud to every announcement.
            announce_scans: false
            # One announcement per peer per tick, so this must exceed the
            # keyframe rate or the backlog below will start dropping places.
            announce_rate_hz: 10.0
            maintenance_period_s: 1.0
            report_period_s: 30.0

            # Announcements held per peer while its link is down. Beyond this
            # the oldest is dropped, so a long outage costs recent places
            # rather than unbounded memory.
            max_pending_announcements: 100

            # Retained scans, own and received, under one budget. These bound
            # memory at the cost of no longer being able to register a revisit
            # of a place that has aged out.
            max_cached_scans: 500
            max_cached_scan_mib: 512

            # Backpressure on scan requests.
            max_inflight_requests: 8
            request_timeout_s: 5.0
            max_request_attempts: 3

            # Candidates waiting for a scan to arrive.
            max_deferred_candidates: 64
            max_deferred_age_s: 60.0

        registration:
            # KISS-Matcher coarse global alignment.
            coarse_voxel_size_m: 2.0
            coarse_use_voxel_sampling: true
            coarse_use_quatro: false
            coarse_linearity_threshold: 0.99
            coarse_max_correspondences: 5000
            coarse_normal_radius_gain: 3.5
            coarse_fpfh_radius_gain: 5.0
            coarse_robin_noise_bound_gain: 1.0
            coarse_solver_noise_bound_gain: 0.75
            coarse_clamp_noise_bounds: true
            min_coarse_correspondences: 5
            min_coarse_inliers: 3

            # Small-GICP fine alignment.
            fine_downsampling_resolution_m: 0.5
            fine_max_correspondence_distance_m: 2.0
            fine_rotation_epsilon_rad: 0.0017453292519943296
            fine_translation_epsilon_m: 0.001
            fine_num_neighbors: 10
            fine_num_threads: 4
            fine_max_iterations: 30
            min_fine_inliers: 20

            # Paper Equation (10): distance is m and score is m^2.
            truncated_mse_max_correspondence_distance_m: 3.0
            max_truncated_mse_m2: 3.0
            min_metric_inliers: 20
            min_overlap_ratio: 0.10

            # Full factor covariance: the Small-GICP Hessian supplies
            # directional observability, while these values calibrate its
            # physical scale and bound weak geometry.
            nominal_rotation_stddev_rad: 0.05
            nominal_translation_stddev_m: 0.20
            uncertainty_reference_mse_m2: 0.04
            uncertainty_min_information_ratio: 0.01
            uncertainty_max_variance_scale: 100.0
