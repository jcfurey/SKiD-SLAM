# ROS 2 parameter file for the ZeroMQ inter-robot bridge.
#
# The bridge carries the inter-robot topics between hosts over a ZeroMQ
# PUB/SUB mesh, so robots need not share a DDS domain. See
# doc/FIELD_COMMUNICATION.md for the deployment, and note that every robot
# needs its own copy of this file: bind_endpoint and peer_endpoints differ per
# platform, unlike the rest of this package's configuration.
/**:
  ros__parameters:
    zmq:
      # This robot's publisher. 0.0.0.0 accepts connections on every
      # interface; bind to a specific one to keep the mesh off other networks.
      bind_endpoint: "tcp://0.0.0.0:7447"

      # Every other robot's bind_endpoint, reachable from here. A full mesh
      # lists all peers; a relay topology lists only the relay.
      peer_endpoints: []

      # Messages held per socket before ZeroMQ discards. PUB drops rather than
      # blocks, which is what a field link needs: an unreachable robot must
      # not stall the robot trying to reach it.
      send_high_water_mark: 100
      receive_high_water_mark: 100

      # Refuse a single frame larger than this rather than allocate it. A
      # feature cloud is the largest thing carried; raise it only if scans are
      # legitimately bigger than this.
      max_payload_mib: 64

      # Discard unsent messages on shutdown instead of waiting for an absent
      # peer, so a node cannot hang on exit.
      linger_ms: 0

      # How often the bridge drains its subscriber.
      poll_rate_hz: 100.0

      # Both timer periods must be finite and strictly positive.
      report_period_s: 30.0

      # Depth of the local ROS publishers and subscriptions.
      # A PCM update can release several direct graph factors in one burst.
      qos_depth: 100

      # Injected echoes are identified by their ROS publisher GID.
      # Byte-identical retransmissions from other publishers remain valid.

      # Leave empty to carry the inter-robot set derived from
      # mapfusion.interRobot.solid_topic: context_info, scan_request,
      # scan_data, loop_info_global, graph_state, alignment_state and trans_odom. Override both lists
      # together to carry something else; they must be the same length.
      topics: []
      topic_types: []
